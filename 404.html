<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost in space | Click Lift</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0418">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Space+Mono&display=swap">
  <style>
    :root { --brand: #330072; --muted: #b9aed0; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #fff;
      font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      background:
        radial-gradient(1px 1px at 12% 18%, #fff, transparent 60%),
        radial-gradient(1px 1px at 28% 72%, rgba(255, 255, 255, 0.7), transparent 60%),
        radial-gradient(1.5px 1.5px at 44% 30%, rgba(226, 210, 255, 0.9), transparent 60%),
        radial-gradient(1px 1px at 63% 12%, rgba(255, 255, 255, 0.8), transparent 60%),
        radial-gradient(1px 1px at 78% 64%, rgba(255, 226, 176, 0.8), transparent 60%),
        radial-gradient(1.5px 1.5px at 88% 26%, #fff, transparent 60%),
        radial-gradient(1px 1px at 8% 86%, rgba(226, 210, 255, 0.8), transparent 60%),
        radial-gradient(1px 1px at 52% 88%, rgba(255, 255, 255, 0.6), transparent 60%),
        radial-gradient(1px 1px at 93% 82%, rgba(255, 255, 255, 0.7), transparent 60%),
        radial-gradient(60% 50% at 50% 110%, rgba(91, 31, 184, 0.6), transparent 70%),
        radial-gradient(50% 40% at 90% 0%, rgba(51, 0, 114, 0.7), transparent 70%),
        #0b0418;
    }
    main { max-width: 520px; }
    .rocket {
      display: block;
      width: 72px;
      height: 72px;
      margin: 0 auto 28px;
      fill: #fff;
      filter: drop-shadow(0 0 18px rgba(173, 123, 244, 0.8));
      animation: drift 6s ease-in-out infinite;
    }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(10px, -12px) rotate(8deg); }
    }
    .code {
      margin: 0 0 12px;
      font-family: "Space Mono", ui-monospace, Menlo, monospace;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
    }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(2.4rem, 8vw, 3.6rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    p { margin: 0 0 32px; color: var(--muted); font-size: 1.1rem; line-height: 1.6; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 0.6em;
      padding: 15px 24px;
      border-radius: 999px;
      background: #fff;
      color: var(--brand);
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 12px 32px -14px rgba(173, 123, 244, 0.75);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    a:hover { transform: translateY(-2px); box-shadow: 0 18px 42px -14px rgba(173, 123, 244, 0.9); }
    a:focus-visible { outline: 2px solid #ffd58a; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      .rocket { animation: none; }
      a { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <svg class="rocket" viewBox="0 0 203.33 203.33" aria-hidden="true" focusable="false"><path d="M92.42 164.64 L166.01 91.05 L130.84 176.87 L104.38 203.33ZM38.69 110.91 L0 98.95 L26.46 72.48 L112.28 37.32ZM203.33 0 L185.74 42.91 L85.71 142.94 L79.74 123.59 L60.39 117.61 L160.42 17.59ZM64.44 138.89 L70.41 158.22 L27.37 175.95 L45.1 132.91ZM92.42 164.64 L79.74 123.59 L38.69 110.91 L64.24 85.36 L105.29 98.04 L117.97 139.09Z"/></svg>
    <p class="code">Error 404</p>
    <h1>Lost in space.</h1>
    <p>This page drifted out of orbit. Let's get you back to base.</p>
    <a href="/" data-home>Back to Earth</a>
  </main>
  <script>
    // On a GitHub Pages project URL (user.github.io/repo/) home is /repo/. On a custom domain it's /.
    (function () {
      var first = location.pathname.split('/')[1];
      if (/github\.io$/.test(location.hostname) && first) {
        document.querySelector('[data-home]').setAttribute('href', '/' + first + '/');
      }
    })();
  </script>
</body>
</html>
